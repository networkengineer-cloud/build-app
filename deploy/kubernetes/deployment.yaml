apiVersion: v1
kind: Namespace
metadata:
  name: build-app
---
apiVersion: v1
kind: Secret
metadata:
  name: build-app-secrets
  namespace: build-app
type: Opaque
stringData:
  WEBHOOK_SECRET: "your-webhook-secret-here"
  GITHUB_TOKEN: "your-github-token-here"
  GITOPS_TOKEN: "your-gitops-token-here"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: build-app-config
  namespace: build-app
data:
  PORT: "8080"
  GITOPS_REPO: "https://github.com/your-org/gitops-repo.git"
  KUBE_NAMESPACE: "build-app"
  CONTAINER_REGISTRY: "ghcr.io"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-app
  namespace: build-app
  labels:
    app: build-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: build-app
  template:
    metadata:
      labels:
        app: build-app
    spec:
      serviceAccountName: build-app
      containers:
      - name: build-app
        image: ghcr.io/networkengineer-cloud/build-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: build-app-config
        - secretRef:
            name: build-app-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: build-app
  namespace: build-app
  labels:
    app: build-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: build-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-app
  namespace: build-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-app
  namespace: build-app
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-app
  namespace: build-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: build-app
subjects:
- kind: ServiceAccount
  name: build-app
  namespace: build-app
---
apiVersion: v1
kind: Secret
metadata:
  name: docker-config
  namespace: build-app
type: kubernetes.io/dockerconfigjson
stringData:
  config.json: |
    {
      "auths": {
        "ghcr.io": {
          "auth": "<base64-encoded-username:token>"
        }
      }
    }
