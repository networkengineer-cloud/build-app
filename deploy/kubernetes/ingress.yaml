apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: build-app
  namespace: build-app
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - webhook.example.com
    secretName: build-app-tls
  rules:
  - host: webhook.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: build-app
            port:
              number: 80
